name: codeql

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1" # semanal: regras novas tambem alcancam codigo parado

permissions:
  contents: read

jobs:
  analyze:
    name: QG-005 CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
          output: codeql-results
      # QG-005: achado alto ou critico (security-severity >= 7.0) reprova o job (DC-049).
      - run: node tools/scripts/sarif-gate.mjs codeql-results
