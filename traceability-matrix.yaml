validator:
  schema: traceability-matrix.schema.json
  executable: traceability-check.py
  ci_command: python traceability-check.py traceability-matrix.yaml MeuRemedio_OpenAPI_02.33.3_COMPLETO.yaml
  fail_on:
  - schema-error
  - source-hash-mismatch
  - unknown-reference
  - missing-operation
  - missing-ownership-test
  - missing-test-artifact
  - missing-error-catalog
resolved_findings:
- id: V-001
  resolution: Ownership/BOLA controls and planned test artifact added to every private operation.
- id: G-ERR
  resolution: ERR-001..ERR-012 cataloged and mapped to operations and negative-test artifacts.
- id: V-003
  resolution: SHA-256 hashes added for all normative sources.
- id: G-TESTART
  resolution: Every TS now contains a planned executable test artifact and evidence fields.
- id: V-004
  resolution: Per-link and per-record provenance added.
- id: G-VALIDATOR
  resolution: JSON Schema and executable semantic validator added.
- id: GAP-RNF-RANGE
  resolution: DEC-002 corrected to RNF-001 through RNF-015, matching the explicit catalog.
- id: GAP-GX-RANGE
  resolution: Production-blocking text corrected to GX-001 through GX-006.
- id: GAP-CATALOGS
  resolution: RN, ENT, FL, TL, US, DEC and Q catalogs added with exact source provenance.
- id: GAP-003
  resolution: Especificação Funcional 02.33 alinhada à OpenAPI 02.33.3; anexo histórico removido e seção 13 gerada do contrato.
- id: R-SESSION
  resolution: ERR-013 SESSION_LIMIT_REACHED e resposta 409 documentada em createSession.
- id: R-DUPLICATE
  resolution: ERR-014, DuplicateConfirmationProblem e duplicate_confirmation_token documentados em createPlan.
- id: R-CSRF
  resolution: RNF-016, CA-018, TS-041, ERR-015 e esquema csrfToken na OpenAPI.
- id: R-TITLES
  resolution: Títulos de RF-001, RF-003, RF-006 e RF-010 corrigidos para o texto do requisito.
- id: R-429
  resolution: 429 documentado em todas as operações exceto getHealth (RNF-006).
- id: R-TS038
  resolution: 'Decisão de 04/10/2026: o replay de revokeAllSessions e requestAccountDeletion após a revogação da própria sessão
    retorna 401 (docs/specifications/P0_SENTINEL_TESTS.md).'
- id: R-APPROVAL-20261004
  resolution: DEC-011 a DEC-025, ADR OA-008 a OA-011, PP-001 v1 (provisório) e proteção da main (opção C) aprovados em 04/10/2026
    pelo mantenedor carlosyano, em caráter interino.
- id: R-ERR007
  resolution: ERR-007 (STATE_CONFLICT) passou a mapear cancelExport, confirmPasswordReset e verifyAccount, que declaram 409
    no contrato; defeito revelado pelo TS-040 (R05).
- id: R-GAP008
  resolution: 'Decisão de 04/10/2026: removido o 410 de createResponse (OpenAPI 02.33.3); R05 do TS-040 sem exceção.'
- id: R-GAP009
  resolution: 'Decisão de 04/10/2026: X-Correlation-ID em toda resposta (OpenAPI 02.33.3); R12 do TS-040 sem exceção.'
