validation_rules:
- id: TR-001
  description: Todo operationId da OpenAPI deve existir em operations.
- id: TR-002
  description: Toda referência RF, CA e TS deve existir no catálogo correspondente.
- id: TR-003
  description: Todo RF com operação HTTP deve possuir pelo menos um operationId.
- id: TR-004
  description: Todo operationId privado deve possuir cobertura de ownership conforme TS-023 no escopo.
- id: TR-005
  description: TS-001, TS-015, TS-024, TS-038 e TS-040 são bloqueadores P0.
- id: TR-006
  description: Referências x-traceability da OpenAPI não podem ser removidas sem alteração normativa.
known_gaps:
- id: GAP-001
  severity: informational
  description: RF-012 é funcional e operacional, mas não possui endpoint público específico na OpenAPI 02.33.3.
- id: GAP-002
  severity: informational
  description: CA-012 é transversal a todas as rotas privadas e é validado por TS-008 e TS-023, sem operationId exclusivo.
- id: GAP-004
  severity: informational
  description: RF-011 e RF-012 são procedimentos operacionais sem endpoint HTTP além de getPrivacy (DEC-022); o procedimento
    está em docs/operations/RIGHTS_AND_INCIDENTS.md.
- id: GAP-006
  severity: informational
  description: Parecer jurídico e de privacidade (GX-001 a GX-006), retenção definitiva de audit_events (GX-003; padrão provisório
    de 180 dias) e conteúdo final de incident_records (GX-006) pendentes. DEC-011 a DEC-025 e ADR OA-008 a OA-011 aprovadas
    em 04/10/2026 pelo mantenedor (interino).
- id: GAP-007
  severity: informational
  description: O catálogo entities sobrescreve a linha da entidade pela última linha do dicionário de campos (ENT-001, 005
    a 011); estrutura preservada por compatibilidade com o schema vigente.
