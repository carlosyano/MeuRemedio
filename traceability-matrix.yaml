business_rules:
  RN-001:
    termo_regra: Natureza declaratória
    defini_o_normativa: O sistema NÃO DEVE prescrever, validar medicamento, interação, médico ou CRM (sem consulta a registro
      profissional; do CRM informado valida-se apenas o formato UF-dígitos), nem recomendar tratamento.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 1
      mapping_type: explicit-catalog-row
  RN-002:
    termo_regra: Titularidade
    defini_o_normativa: Cada conta DEVE ser individual; o usuário só pode acessar seus próprios registros.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 2
      mapping_type: explicit-catalog-row
  RN-003:
    termo_regra: Conta
    defini_o_normativa: Conta nova inicia PENDING_VERIFICATION e não autentica antes da verificação.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 3
      mapping_type: explicit-catalog-row
  RN-004:
    termo_regra: Sessão
    defini_o_normativa: Sessão expira após 30 minutos de inatividade e 24 horas de duração absoluta; máximo de 3 sessões ativas;
      a 4ª sessão é rejeitada com 409 SESSION_LIMIT_REACHED.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 4
      mapping_type: explicit-catalog-row
  RN-005:
    termo_regra: Bloqueio
    defini_o_normativa: Após 5 falhas em 15 minutos, bloquear novas tentativas por 15 minutos. O contador usa o hash do e-mail
      normalizado, inclusive de e-mails inexistentes, e a resposta é sempre 423 com Retry-After.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 5
      mapping_type: explicit-catalog-row
  RN-006:
    termo_regra: Plano
    defini_o_normativa: Cada plano ACTIVE possui de 1 a 10 horários civis únicos.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 6
      mapping_type: explicit-catalog-row
  RN-007:
    termo_regra: Ocorrência
    defini_o_normativa: Deve existir no máximo uma ocorrência por plano, horário e data civil local.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 7
      mapping_type: explicit-catalog-row
  RN-008:
    termo_regra: Resposta
    defini_o_normativa: Somente a primeira resposta concorrente é aceita; resposta aceita é imutável.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 8
      mapping_type: explicit-catalog-row
  RN-009:
    termo_regra: Prazo
    defini_o_normativa: Sem resposta até 60 minutos após scheduled_at, a ocorrência passa a NO_RESPONSE; resposta tardia continua
      permitida.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 9
      mapping_type: explicit-catalog-row
  RN-010:
    termo_regra: Histórico
    defini_o_normativa: Consulta cobre período civil inclusivo de até 12 meses, implementado como intervalo semiaberto no
      fuso da conta.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 10
      mapping_type: explicit-catalog-row
  RN-011:
    termo_regra: PDF
    defini_o_normativa: PDF é privado, pesquisável, baseado em snapshot e expira após 24 horas.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 11
      mapping_type: explicit-catalog-row
  RN-012:
    termo_regra: Exclusão
    defini_o_normativa: Solicitação bloqueia acesso de imediato; expurgo ocorre em até 30 dias [APROVADO Q-001].
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 12
      mapping_type: explicit-catalog-row
  RN-013:
    termo_regra: Tempo
    defini_o_normativa: Instantes são persistidos em UTC; datas civis usam account_timezone IANA, imutável no MVP.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 13
      mapping_type: explicit-catalog-row
  RN-014:
    termo_regra: E-mail
    defini_o_normativa: SENT significa aceito tecnicamente pelo provedor, não entregue ou lido.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 14
      mapping_type: explicit-catalog-row
  RN-015:
    termo_regra: Página offline
    defini_o_normativa: A aplicação NÃO DEVE declarar sucesso nem criar fila offline sem confirmação do servidor.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 15
      mapping_type: explicit-catalog-row
  RN-016:
    termo_regra: Duplicidade de plano
    defini_o_normativa: 'Na criação, plano ACTIVE do mesmo titular com medication_name e dose_text iguais após normalização
      e período sobreposto exige confirmação: 409 DUPLICATE_CONFIRMATION_REQUIRED com token de uso único e TTL de 10 minutos.
      Aplica-se somente à criação.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 16
      mapping_type: explicit-catalog-row
  RN-017:
    termo_regra: Credenciais e tokens
    defini_o_normativa: Senha de 10 a 72 caracteres com minúscula, maiúscula e dígito, fora da lista local de senhas comprometidas
      e sem consulta remota; hash Argon2id. Token de verificação vale 24 h e o de redefinição 60 min, ambos de uso único;
      novo token invalida o anterior.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 17
      mapping_type: explicit-catalog-row
  RN-018:
    termo_regra: Agenda e lembretes
    defini_o_normativa: Ocorrências são geradas ao criar ou editar o plano (via Outbox) e por job horário que mantém o horizonte
      de 30 dias; o job de prazo executa a cada minuto. Há no máximo 1 e-mail de lembrete por ocorrência, enviado em scheduled_at,
      sem nome do medicamento, dose ou link com token. O lembrete web consulta listOccurrences a cada 60 s.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 18
      mapping_type: explicit-catalog-row
  RN-019:
    termo_regra: Tombstone
    defini_o_normativa: Tombstone contém user_id e HMAC-SHA-256 do e-mail normalizado com pepper em KMS, retido por 180 dias;
      serve à reconciliação de restore e não impede novo cadastro com o mesmo e-mail.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 3
      row_index: 19
      mapping_type: explicit-catalog-row
