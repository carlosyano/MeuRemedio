decisions:
  DEC-001:
    criticidade: Alta
    problema_causa: Cabeçalho interno 02.20 conflitava com versão 02.30.
    decis_o_adotada: Uniformizar para 02.32 e declarar prevalência.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 1
      mapping_type: explicit-catalog-row
  DEC-002:
    criticidade: Alta
    problema_causa: Faixas antigas RNF01-24 e ST01-32 ficaram obsoletas após complementos.
    decis_o_adotada: Baseline consolidada usa RNF-001 a RNF-015 e TS-001 a TS-040.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 2
      mapping_type: explicit-catalog-row
  DEC-003:
    criticidade: Alta
    problema_causa: Critérios eram AC, mas o framework exige CA.
    decis_o_adotada: Mapear AC01-AC14 para CA-001 a CA-014 sem alterar semântica.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 3
      mapping_type: explicit-catalog-row
  DEC-004:
    criticidade: Alta
    problema_causa: Lista ativa do plano excluído não tinha regra única em todo o texto.
    decis_o_adotada: Planos DELETED ficam ocultos da operação e preservados apenas por snapshots históricos.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 4
      mapping_type: explicit-catalog-row
  DEC-005:
    criticidade: Alta
    problema_causa: Entrega incerta de e-mail não tinha estado inicial uniforme.
    decis_o_adotada: Adotar DELIVERY_UNKNOWN e conciliação sem reenvio cego.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 5
      mapping_type: explicit-catalog-row
  DEC-006:
    criticidade: Média
    problema_causa: Paginação padrão conflitava entre 20 e 50.
    decis_o_adotada: Adotar 20 itens por padrão e máximo 100, conforme baseline mestre.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 6
      mapping_type: explicit-catalog-row
  DEC-007:
    criticidade: Alta
    problema_causa: TLS/AES estavam descritos de forma genérica.
    decis_o_adotada: Exigir TLS 1.3 em trânsito e AES-256 ou controle gerenciado equivalente em repouso.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 7
      mapping_type: explicit-catalog-row
  DEC-008:
    criticidade: Alta
    problema_causa: Dado de medicamento e resposta requer proteção conservadora.
    decis_o_adotada: Classificar como dado pessoal sensível de saúde.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 8
      mapping_type: explicit-catalog-row
  DEC-009:
    criticidade: Média
    problema_causa: Operações mutáveis não tinham matriz única.
    decis_o_adotada: Idempotency-Key obrigatória para criar conta/plano, editar plano, responder, exportar e excluir conta.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 9
      mapping_type: explicit-catalog-row
  DEC-010:
    criticidade: Alta
    problema_causa: Produção poderia parecer liberada apesar de gates.
    decis_o_adotada: Status BASELINE DEV-FINAL até aprovações Q/GX.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 10
      mapping_type: explicit-catalog-row
  DEC-011:
    criticidade: Alta
    problema_causa: Limite de 3 sessões (CA-003) exigia 409 sem código de erro nem resposta documentada no contrato.
    decis_o_adotada: Criar ERR-013 SESSION_LIMIT_REACHED (409) e documentar a resposta em createSession.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 11
      mapping_type: explicit-catalog-row
  DEC-012:
    criticidade: Alta
    problema_causa: Confirmação de possível duplicidade de plano não tinha critério, schema de resposta nem forma de confirmação;
      o contrato citava 409 BUSINESS_RULE_VIOLATION, mas ERR-009 mapeia 422.
    decis_o_adotada: 'Criar ERR-014 DUPLICATE_CONFIRMATION_REQUIRED (409) com DuplicateConfirmationProblem; critério: mesmo
      titular, plano ACTIVE, nome e dose normalizados iguais e períodos sobrepostos; token de uso único, TTL 10 min, reenviado
      em duplicate_confirmation_token com nova Idempotency-Key; aplica-se só à criação.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 12
      mapping_type: explicit-catalog-row
  DEC-013:
    criticidade: Alta
    problema_causa: A ADR e o AGENTS exigem CSRF, mas o contrato não definia mecanismo, cabeçalho nem cookies.
    decis_o_adotada: Adotar double-submit vinculado à sessão (cookie mr_csrf + X-CSRF-Token) e validação de Origin; cookie
      mr_session HttpOnly, Secure, SameSite=Lax; falha retorna ERR-015 CSRF_VALIDATION_FAILED (403) nas 11 mutações autenticadas.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 13
      mapping_type: explicit-catalog-row
  DEC-014:
    criticidade: Alta
    problema_causa: A Especificação 02.32 descrevia 24 operações e DELETE /sessions, divergindo da OpenAPI 02.33.x (27 operações).
    decis_o_adotada: 'Alinhar a Especificação à OpenAPI 02.33.3: revokeAllSessions (POST /sessions/revocations), /accounts/me,
      cancelExport, estado CANCELED de exportação (FL-005) e nova seção 13 gerada a partir do contrato.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 14
      mapping_type: explicit-catalog-row
  DEC-015:
    criticidade: Alta
    problema_causa: 'Credenciais e tokens sem parâmetros: validade do token de redefinição, algoritmo de hash e fonte da lista
      de senhas comprometidas (TS-036).'
    decis_o_adotada: 'Adotar RN-017: Argon2id; verificação 24 h e redefinição 60 min, uso único; lista local versionada de
      senhas comprometidas, sem consulta remota; rejeição com 400 VALIDATION_FAILED e field_errors[].code=PASSWORD_COMPROMISED.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 15
      mapping_type: explicit-catalog-row
  DEC-016:
    criticidade: Alta
    problema_causa: Bloqueio de login (RN-005) sem definição de chave nem tratamento de e-mails inexistentes.
    decis_o_adotada: Contador por HMAC do e-mail normalizado, inclusive inexistentes; resposta sempre 423 com Retry-After;
      limite por IP via rate limit (RNF-006).
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 16
      mapping_type: explicit-catalog-row
  DEC-017:
    criticidade: Média
    problema_causa: Geração de ocorrências, job de prazo e lembretes sem gatilhos e sem conteúdo do e-mail minimizado.
    decis_o_adotada: 'Adotar RN-018: geração ao criar/editar plano (Outbox) e job horário; job de prazo a cada minuto; 1 e-mail
      por ocorrência em scheduled_at, sem nome, dose ou link com token; lembrete web por consulta de 60 s.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 17
      mapping_type: explicit-catalog-row
  DEC-018:
    criticidade: Média
    problema_causa: Conteúdo e finalidade do tombstone indefinidos (TS-029).
    decis_o_adotada: 'Adotar RN-019: user_id + HMAC-SHA-256 do e-mail com pepper em KMS, 180 dias, usado na reconciliação
      de restore; não impede novo cadastro.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 18
      mapping_type: explicit-catalog-row
  DEC-019:
    criticidade: Média
    problema_causa: Rate limit multi-instância (RNF-006) sem mecanismo e sem broker/cache no MVP.
    decis_o_adotada: Contadores em tabela PostgreSQL UNLOGGED com janela por chave; WAF opcional na borda; getHealth isento;
      429 documentado em todas as operações exceto getHealth.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 19
      mapping_type: explicit-catalog-row
  DEC-020:
    criticidade: Média
    problema_causa: RNF-015 não fixava o limite de desvio de relógio.
    decis_o_adotada: CLOCK_SKEW_MAX_MS padrão 5000; acima disso getHealth retorna DEGRADED e decisões temporais críticas são
      bloqueadas.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 20
      mapping_type: explicit-catalog-row
  DEC-021:
    criticidade: Média
    problema_causa: PerformanceProfile (ENT-017) sem conteúdo; RNF-004, RNF-005 e TS-039 dependiam dele.
    decis_o_adotada: Definir PP-001 v1 em docs/specifications/performance-profile.v1.yaml, aprovado como provisório em 04/10/2026
      pelo mantenedor (interino), a recalibrar após os spikes de infraestrutura.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 21
      mapping_type: explicit-catalog-row
  DEC-022:
    criticidade: Média
    problema_causa: RF-011 e RF-012 não possuíam operação nem perfil administrativo; RBAC do RNF-003 só previa o titular.
    decis_o_adotada: Tratar RF-011/RF-012 como procedimentos operacionais sem endpoint HTTP (docs/operations/RIGHTS_AND_INCIDENTS.md);
      papel único TITULAR na API; acesso operacional por IAM e scripts auditados.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 22
      mapping_type: explicit-catalog-row
  DEC-023:
    criticidade: Baixa
    problema_causa: Exemplos usavam America/Sao_Paulo, que não tem horário de verão desde 2019; TS-024 não tinha fixtures.
    decis_o_adotada: Exigir fixtures America/New_York, Europe/Lisbon, America/Santiago e Australia/Lord_Howe; account_timezone
      aceita IANA canônico da versão de tzdata fixada.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 23
      mapping_type: explicit-catalog-row
  DEC-024:
    criticidade: Baixa
    problema_causa: RN-001 proibia validar CRM, mas o contrato valida o formato UF-dígitos e TS-012 cita CRM.
    decis_o_adotada: 'Esclarecer RN-001: sem consulta a registro profissional; apenas o formato do CRM é validado.'
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 24
      mapping_type: explicit-catalog-row
  DEC-025:
    criticidade: Baixa
    problema_causa: RNF-010 citava dinheiro decimal exato, inexistente no produto.
    decis_o_adotada: Remover o termo de RNF-010.
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 2
      row_index: 25
      mapping_type: explicit-catalog-row
approved_questions:
  Q-001:
    decis_o_aprovada: Retenção e exclusão
    regra_normativa: Por quanto tempo os dados devem permanecer antes do expurgo definitivo?
    alternativa_aprovada: 'A: aprovar conta em até 30 dias, PDF 24 h, logs 30 dias, idempotência 7 dias e tombstone 180 dias.
      B: fornecer outros prazos aprovados.'
    justificativa: A reduz ambiguidade e preserva as premissas já usadas.
    status: APROVADO
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 14
      row_index: 1
      mapping_type: explicit-catalog-row
  Q-002:
    decis_o_aprovada: Continuidade
    regra_normativa: Qual nível de recuperação deve ser prometido para o MVP?
    alternativa_aprovada: 'A: aceitar perda máxima de 24 h e retorno em até 8 h. B: definir metas menores, com maior custo
      operacional.'
    justificativa: A é compatível com um MVP, desde que o risco seja aceito.
    status: APROVADO
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 14
      row_index: 2
      mapping_type: explicit-catalog-row
  Q-003:
    decis_o_aprovada: Privacidade e base legal
    regra_normativa: Quem será responsável pelos dados e qual fundamento autoriza cada uso?
    alternativa_aprovada: 'A: aprovar controlador, operadores, canal, textos e base legal antes da produção. B: não lançar
      até redefinir o produto.'
    justificativa: A permite desenvolver sem antecipar decisão jurídica.
    status: APROVADO
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 14
      row_index: 3
      mapping_type: explicit-catalog-row
  Q-004:
    decis_o_aprovada: Canal de direitos
    regra_normativa: Como o usuário fará pedidos não automatizados, como correção de e-mail ou oposição?
    alternativa_aprovada: 'A: canal externo com protocolo e prazo aprovado. B: desenvolver fluxo interno adicional, ampliando
      escopo.'
    justificativa: A preserva o escopo do MVP e mantém rastreabilidade.
    status: APROVADO
    provenance:
      source: MeuRemedio_Especificacao_Funcional_02.33.docx
      table_index: 14
      row_index: 4
      mapping_type: explicit-catalog-row
