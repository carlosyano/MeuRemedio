        no calendario civil da conta (a leitura devolve os dias na ordem de segunda a domingo). EVERY_N_DAYS: a cada
        interval_days dias contados da data de inicio (o inicio e o primeiro dia). Os horarios valem em cada dia
        da periodicidade. Omitido em PlanWrite e CreatePlanRequest, vale DAILY.'
