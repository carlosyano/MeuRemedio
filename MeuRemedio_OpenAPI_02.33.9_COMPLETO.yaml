# MeuRemedio OpenAPI 02.33.9 - completo
# Base: MeuRemedio_OpenAPI_02.33.8_COMPLETO.yaml
# Mudancas 02.33.3 (decisao de 04/10/2026): removido o 410 de createResponse (GAP-008); X-Correlation-ID em toda resposta, inclusive 202, 204 e getHealth (GAP-009).
# Mudancas 02.33.4 (decisao de 06/10/2026, DEC-026, GAP-010): falha inesperada documentada em toda operacao,
# com 500 INTERNAL_ERROR (ERR-016, resposta InternalError) e 503 DEPENDENCY_UNAVAILABLE (ERR-011).
# Mudancas 02.33.5 (decisao de 10/10/2026, DEC-032): 400 VALIDATION_FAILED documentado em createSession,
# revokeAllSessions e requestAccountDeletion, que validam corpo e Idempotency-Key e nao o declaravam.
# Mudancas 02.33.6 (decisao de 15/10/2026, DEC-034): nova operacao listExports (GET /exports) e schema
# ExportRequestPage, para o titular listar os proprios pedidos de exportacao.
# Mudancas 02.33.7 (decisao de 27/10/2026, DEC-035): parametro opcional local_date em listOccurrences, para
# listar as ocorrencias de um dia civil no fuso da conta, inclusive as ainda nao alcancadas.
# Mudancas 02.33.8 (decisao de 27/10/2026, DEC-036): situacao do plano. PlanStatus ganha CANCELED e
# INTERRUPTED; Plan ganha status_reason, status_note e status_changed_at; nova operacao changePlanStatus
# (POST /plans/{plan_id}/status-changes) para cancelar, interromper e retomar, sempre com motivo.
# Mudancas 02.33.9 (decisao de 27/10/2026, DEC-037): periodicidade do plano. PlanWrite, CreatePlanRequest e Plan
# ganham recurrence (PlanRecurrence): todos os dias (DAILY, padrao quando omitido), dias da semana escolhidos
# (WEEKDAYS) ou a cada N dias contados da data de inicio (EVERY_N_DAYS, de 2 a 365).
# Mantem os operationId da 02.33.2 e acrescenta listExports e changePlanStatus (29 operacoes).
openapi: 3.1.1
info:
  title: MeuRemedio API
  version: 02.33.9
  summary: Contrato normativo revisado da baseline de desenvolvimento 02.33.9
  description: API declaratoria para conta individual, planos de medicamentos, ocorrencias, respostas, historico,
    exportacoes e privacidade. Nao prescreve, nao valida medicamentos ou interacoes e nao substitui orientacao profissional.
    Todas as mutacoes autenticadas exigem protecao CSRF (cookie mr_csrf + cabecalho X-CSRF-Token) e validacao do
    cabecalho Origin; a API nao habilita CORS para origens fora da lista configurada do ambiente (same-site com
    a aplicacao web). Toda resposta, de sucesso ou de erro, inclui o cabecalho X-Correlation-ID.
  contact:
    name: Canal do produto a definir em GX-002
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.example.invalid
  description: URL ilustrativa. Substituir por ambiente autorizado.
tags:
- name: Accounts
- name: Sessions
- name: Plans
- name: Occurrences
- name: History
- name: Exports
- name: Privacy
- name: Operations
security:
- sessionCookie: []
paths:
  /accounts:
    post:
      tags:
      - Accounts
      summary: Criar conta
      operationId: createAccount
      responses:
        '201':
          description: Conta criada
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Ana Silva
              email: ana.silva@example.com
              password: ForteSenha123
              account_timezone: America/Sao_Paulo
              terms_version: 2026-09
              privacy_notice_version: 2026-09
              terms_accepted: true
              privacy_notice_acknowledged: true
      x-traceability:
      - RF-001
      - CA-001
      - TS-038
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Cria conta PENDING_VERIFICATION e emite token de verificacao (24 h). Resposta nao revela se o
        e-mail ja existe alem do 409 contratual.
  /accounts/verify:
    post:
      tags:
      - Accounts
      summary: Verificar conta
      operationId: verifyAccount
      responses:
        '204':
          description: Conta ativada ou token ja consumido sem novo efeito
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccountRequest'
      x-traceability:
      - RF-001
      - CA-002
      - TS-009
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Consome o token de verificacao e ativa a conta de forma atomica. Token ja consumido nao produz
        novo efeito.
  /accounts/verification-resends:
    post:
      tags:
      - Accounts
      summary: Solicitar reenvio de verificacao
      operationId: resendVerification
      responses:
        '202':
          description: Resposta neutra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationResendRequest'
      x-traceability:
      - RF-001
      - TS-021
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Resposta neutra (202) independente da existencia da conta; invalida o token anterior.
  /password-reset-requests:
    post:
      tags:
      - Accounts
      summary: Solicitar redefinicao de senha
      operationId: requestPasswordReset
      responses:
        '202':
          description: Resposta neutra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      x-traceability:
      - RF-002
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: 'Resposta neutra (202) independente da existencia da conta. Token de redefinicao: uso unico,
        validade de 60 min.'
  /password-resets:
    post:
      tags:
      - Accounts
      summary: Confirmar redefinicao de senha
      operationId: confirmPasswordReset
      responses:
        '204':
          description: Senha alterada e sessoes revogadas
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      x-traceability:
      - RF-002
      - TS-009
      - TS-036
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Troca a senha com token valido e revoga todas as sessoes da conta.
  /sessions:
    post:
      tags:
      - Sessions
      summary: Criar sessao
      operationId: createSession
      responses:
        '201':
          description: Sessao criada
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/SessionLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-traceability:
      - RF-002
      - CA-003
      - CA-004
      - TS-018
      - TS-033
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Falhas por e-mail inexistente e por senha incorreta sao indistinguiveis (401). O contador de
        falhas (5 em 15 min) e mantido por hash do e-mail normalizado, inclusive para e-mails inexistentes, e o
        bloqueio retorna sempre 423 com Retry-After. A 4a sessao ativa retorna 409 SESSION_LIMIT_REACHED.
  /sessions/current:
    delete:
      tags:
      - Sessions
      summary: Encerrar sessao atual
      operationId: deleteCurrentSession
      responses:
        '204':
          description: Sessao revogada de forma idempotente
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-traceability:
      - RF-002
      - CA-018
      - TS-041
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      security:
      - sessionCookie: []
        csrfToken: []
      description: Revoga a sessao atual de forma idempotente e limpa os cookies mr_session e mr_csrf.
  /preferences/accessibility:
    get:
      tags:
      - Accounts
      summary: Consultar preferencias de acessibilidade
      operationId: getAccessibilityPreferences
      responses:
        '200':
          description: Preferencias
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibilityPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      x-traceability:
      - RF-009
      description: Retorna as preferencias de acessibilidade do titular autenticado.
    put:
      tags:
      - Accounts
      summary: Atualizar preferencias de acessibilidade
      operationId: updateAccessibilityPreferences
      responses:
        '200':
          description: Preferencias atualizadas
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibilityPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessibilityPreferences'
      x-traceability:
      - RF-009
      - TS-022
      - CA-018
      - TS-041
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      security:
      - sessionCookie: []
        csrfToken: []
      description: Substitui as preferencias de acessibilidade do titular autenticado.
  /plans:
    get:
      tags:
      - Plans
      summary: Listar planos ativos
      operationId: listPlans
      responses:
        '200':
          description: Pagina de planos
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      x-traceability:
      - RF-003
      - TS-037
      - DEC-037
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Lista os planos do titular (ACTIVE, CANCELED e INTERRUPTED, DEC-036) com paginacao por cursor
        (padrao 20, maximo 100). Planos DELETED nao sao listados.
    post:
      tags:
      - Plans
      summary: Criar plano
      operationId: createPlan
      responses:
        '201':
          description: Plano criado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConflictOrDuplicateConfirmation'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      x-traceability:
      - RF-003
      - CA-005
      - TS-003
      - TS-015
      - TS-038
      - CA-018
      - TS-041
      - CA-017
      - TS-043
      - DEC-037
      description: Se houver candidato de duplicidade e o corpo nao trouxer duplicate_confirmation_token valido,
        retorna 409 com code DUPLICATE_CONFIRMATION_REQUIRED (schema DuplicateConfirmationProblem). Esse 409 nao
        e persistido como snapshot de idempotencia; a confirmacao e reenviada com o token e uma NOVA Idempotency-Key.
        A verificacao de duplicidade aplica-se somente a criacao.
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      security:
      - sessionCookie: []
        csrfToken: []
  /plans/{plan_id}:
    get:
      tags:
      - Plans
      summary: Obter plano ativo
      operationId: getPlan
      responses:
        '200':
          description: Plano
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      x-traceability:
      - RF-003
      - TS-008
      - TS-037
      - DEC-037
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      description: Retorna plano ACTIVE do titular com ETag. Recurso inexistente, excluido ou de outro titular retorna
        404.
    put:
      tags:
      - Plans
      summary: Editar plano
      operationId: updatePlan
      responses:
        '200':
          description: Plano alterado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      x-traceability:
      - RF-003
      - CA-006
      - TS-004
      - TS-014
      - TS-027
      - TS-038
      - CA-018
      - TS-041
      - DEC-037
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      description: 'Concorrencia otimista: If-Match ausente ou malformado retorna 400 VALIDATION_FAILED; ETag obsoleto
        retorna 409 VERSION_CONFLICT. O cliente nao envia row_version nem expected_row_version.'
      security:
      - sessionCookie: []
        csrfToken: []
    delete:
      tags:
      - Plans
      summary: Excluir plano
      operationId: deletePlan
      responses:
        '204':
          description: Exclusao logica idempotente
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      x-traceability:
      - RF-003
      - TS-005
      - TS-037
      - CA-018
      - TS-041
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      security:
      - sessionCookie: []
        csrfToken: []
      description: 'Exclusao logica: cancela ocorrencias futuras PROGRAMMED e preserva snapshots historicos.'
  /plans/{plan_id}/status-changes:
    post:
      tags:
      - Plans
      summary: Mudar situacao do plano
      operationId: changePlanStatus
      responses:
        '200':
          description: Situacao alterada
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanStatusRequest'
      x-traceability:
      - RF-003
      - DEC-036
      - TS-038
      - CA-018
      - TS-041
      x-security-requirements:
      - TLS 1.3
      - UTF-8
      - application/problem+json
      - correlation_id
      - CSRF X-CSRF-Token + Origin
      security:
      - sessionCookie: []
        csrfToken: []
      description: 'Cancela o plano que ainda nao comecou (CANCEL), interrompe o que esta em andamento (INTERRUPT)
        ou retoma o interrompido que ainda nao terminou (RESUME), sempre com motivo (DEC-036). Transicao invalida
        retorna 409 STATE_CONFLICT. Cancelar e interromper cancelam as ocorrencias futuras PROGRAMMED; a retomada
        so gera horarios a partir dela. Concorrencia otimista como em updatePlan: If-Match ausente ou malformado
        retorna 400 VALIDATION_FAILED; ETag obsoleto retorna 409 VERSION_CONFLICT.'
  /occurrences:
    get:
      tags:
      - Occurrences
      summary: Listar ocorrencias acionaveis
      operationId: listOccurrences
      responses:
        '200':
          description: Pagina de ocorrencias
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrencePage'
